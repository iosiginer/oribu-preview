<style>:root{--ink:#1c1916;--paper:#faf7f1;--red:#d63c3c;--pow:#ffb703;--blue:#3a86ff;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a9cde6;font-family:var(--sans);color:var(--ink);overscroll-behavior:none}
[hidden]{display:none!important}
#game{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;gap:10px;align-items:center;pointer-events:none}
#hud span{background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--red);border-radius:12px;padding:4px 10px;font:700 15px var(--sans);font-variant-numeric:tabular-nums}
#hud #bal{margin-right:auto}
.hb{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--red);display:grid;place-items:center;font:700 16px var(--sans);color:var(--ink);text-decoration:none;cursor:pointer;padding:0}

.ov{position:absolute;inset:0;display:grid;place-items:center;background:#a9cde6cc;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:auto}
.box{background:var(--paper);border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--red);border-radius:20px;padding:16px 22px;max-width:440px;width:100%;text-align:center}

</style></head><body>
<div id="game">
  <canvas id="cv" aria-label="Oribu game"></canvas>
  <div id="hud"><a class="hb" href="https://puzzles-josef.vercel.app/" aria-label="Back to Tablero">←</a><span id="time">0:00.0</span><span id="bal">🎈 0/20</span><button class="hb" id="pauseBtn" aria-label="Pause">❚❚</button></div>
  <div id="pad">
    <div class="mv"><button data-k="l" aria-label="Left">◀</button><button data-k="r" aria-label="Right">▶</button></div>
    <div class="ac"><button data-k="swing" class="sw" aria-label="Swing">SWING</button><button data-k="jump" class="jp" aria-label="Jump">JUMP</button></div>
  </div>
  <div id="rotate" hidden>Turn your phone sideways ↻</div>
  <div id="title" class="ov"><div class="box">
    <h1>Oribu</h1><p class="sub">Rooftop Run</p>
    <p class="hint">Bring back the runaway balloons!<br><b>◀ ▶</b> run · <b>JUMP</b> (hold = higher) · hold <b>SWING</b> on the yellow rings, let go to fly</p>
    <p class="keys">Keyboard: ← → / A D · Space / W jump · Shift / J swing</p>
    <button class="btn" id="play">Play</button><button class="btn ghost" id="cont" hidden>Continue from flag</button>
    <p class="best" id="best"></p></div></div>
  <div id="pause" class="ov" hidden><div class="box"><h2>Paused</h2><button class="btn" id="resume">Keep going</button><button class="btn ghost" id="restart">Start over</button><a class="btn ghost" href="https://puzzles-josef.vercel.app/">Back to Tablero</a></div></div>
  <div id="end" class="ov" hidden><div class="box"><h2>You did it! 🎉</h2><p class="big" id="endTime"></p><p id="endBal"></p><p class="best" id="endBest"></p><button class="btn" id="again">Play again</button><a class="btn ghost" href="https://puzzles-josef.vercel.app/">Back to Tablero</a></div></div>
</div>
<script type="module">
// ---- tuning.js
// Oribu — ALL feel numbers live here. Units: tiles (32 px) and seconds. Sim runs at a fixed 60 steps/s.
const TILE = 32;
const HZ = 60;
const T = {
  // run
  runTop: 6,            // tiles/s
  runAccelTime: 0.15,   // s from 0 to top
  runDecelTime: 0.08,   // s from top to 0 (stops within ~0.25 tile)
  airDecelTime: 0.35,   // s, when no input in the air (keeps wall-kicks and swing launches flowing)
  overspeedDrag: 6,     // tiles/s² bleed when faster than runTop (after a swing launch)
  // jump
  jumpHold: 4.5,        // tiles, holding jump
  jumpTap: 2,           // tiles, a quick tap
  gravity: 75,          // tiles/s² base
  fallMult: 1.6,        // gravity multiplier while falling
  maxFall: 28,          // tiles/s
  coyote: 0.15,         // s grace after leaving a ledge
  buffer: 0.12,         // s a jump press is remembered before landing
  // swing
  swingRange: 6,        // tiles: grabs nearest glowing anchor ahead/above
  ropeMax: 5,           // tiles: rope length at grab is capped here
  releaseBoost: 1.3,
  assistTime: 0.3,      // s after a swing release: horizontal steer toward the landing roof (gravity stays normal)
  assistMinRun: 10,
  assistLift: 10,        // tiles/s: a release always leaves with at least this much upward speed      // tiles/s forward speed floor during the assist
  swingMaxSpeed: 12,    // tiles/s
  swingPump: 10,        // tiles/s² sideways push from ◀ ▶ while swinging
  regrabDelay: 0.15,    // s after a release before the rope can grab again
  // wall
  wallSlideMax: 2,      // tiles/s
  wallJumpOut: 3,       // tiles
  wallJumpUp: 3.5,      // tiles
  wallLock: 0.15,       // s steering back toward the wall is ignored after a kick
  // bop + bounce
  bop: 3, bopHeld: 4.5, // tiles
  awning: 12,           // tiles, bounce awning height
  // pigeon side bump (no respawn)
  hitHopX: 4, hitHopUp: 1, // tiles/s back, tiles high
  invuln: 0.5,          // s grace after a bump: pigeons can't re-touch you (Oribu stays visible)
  // respawn
  respawnTime: 0.6,     // s total: spin + shrink, poof, then back at the flag
  poofAt: 0.15,         // s left on the respawn timer when the poof fires
  pigeonSpeed: 1.2,     // tiles/s
  pigeonRespawn: 3,     // s
  // body (px)
  w: 20, h: 40,
};
// Derived values in px and px/s (computed, don't edit)
function derive(t = T) {
  const g = t.gravity * TILE;
  const v = h => Math.sqrt(2 * g * h * TILE) + g / (2 * HZ); // + half-step so discrete 60 Hz integration reaches the full height
  const top = t.runTop * TILE;
  return {
    g, fallG: g * t.fallMult, maxFall: t.maxFall * TILE, top,
    accel: top / t.runAccelTime, decel: top / t.runDecelTime, airDecel: top / t.airDecelTime, overDrag: t.overspeedDrag * TILE,
    jumpV: v(t.jumpHold), cutMult: t.jumpHold / t.jumpTap, // releasing early multiplies rising gravity so a tap tops out at jumpTap
    range: t.swingRange * TILE, ropeMax: t.ropeMax * TILE, swingMax: t.swingMaxSpeed * TILE, pump: t.swingPump * TILE,
    wallSlide: t.wallSlideMax * TILE, wallUp: v(t.wallJumpUp),
    // horizontal speed so the kick covers wallJumpOut tiles by the apex
    wallOut: t.wallJumpOut * TILE / (v(t.wallJumpUp) / g),
    bopV: v(t.bop), hitUp: v(t.hitHopUp), hitX: t.hitHopX * TILE, assistMin: t.assistMinRun * TILE, assistLift: t.assistLift * TILE, bopHeldV: v(t.bopHeld), awningV: v(t.awning),
    pigeon: t.pigeonSpeed * TILE,
  };
}

// ---- level.js
// Rooftop Run — tile map. 32px tiles. Legend:
// # roof  W clingable wall (mint stripe)  ^ bounce awning  o swing anchor  b balloon
// S start  C checkpoint flag  F finish flag  p pigeon
const LEVEL = { name: "Rooftop Run", rows: [
  "                                                                                                                                                                 #######",
  "                                                                                                                       W                                         #######",
  "                                                                                                                       W              o                          #######",
  "                                                                                                                       W                                         #######",
  "                                                                               o                                       W            b                            #######",
  "                                                                                            o    o    o                W b W#######                              #######",
  "                                                     W                                                                 W   W#######                              #######",
  "                                                     W                        b                                        W   W#######                       b F    #######",
  "                                                     W b      C   b                         b    b    b                W   W#######                    #################",
  "                                                     W   W##################                                               W#######                    #################",
  "                                                     W   W##################      #######                                  W#######                    #################",
  "                                                     W b W##################      #######                     C    b       W#######           b        #################",
  "                                                     W   W##################      #######                 #################W#######               p    #################",
  "                                                     W   W##################      #######                 #################W#######      ###############################",
  "                                                     W   W##################      #######                 #################W#######      ###############################",
  "                                                       b W##################      #######                 #################W#######      ###############################",
  "               b       b                                 W##################      #######                 #################W#######      ###############################",
  "         b                                  b            W##################   b  #######                 #################W#######      ###############################",
  "  S C                            b              C b      W##################      #######                 #################W#######      ###############################",
  "##############  ######   ######          ################W##################^^^^^^#######                 #################W#######      ###############################",
  "##############  ######   ######          ################W###############################                 #################W#######      ###############################",
  "##############  ######   ######          ################W###############################                 #################W#######      ###############################",
  "##############  ######   ######    ######################W###############################                 #################W#######      ###############################",
  "##############  ######   ######    ######################W###############################                 #################W#######      ###############################",
  "##############  ######   ######    ######################W###############################                 #################W#######      ###############################",
  "##############  ######   ######    ######################W###############################                 #################W#######      ###############################"
] };

// ---- physics.js
// Pure, deterministic sim (no DOM, clock or randomness). step(state, input) advances exactly 1/60 s.
const DT = 1 / HZ;
const SOLID = new Set(["#", "W"]);

function parseLevel(level) {
  const rows = level.rows, H = rows.length, W = Math.max(...rows.map(r => r.length));
  const grid = rows.map(r => r.padEnd(W, " ").split(""));
  const out = { W, H, grid, anchors: [], balloons: [], checkpoints: [], pigeons: [], start: null, finish: null };
  grid.forEach((row, y) => row.forEach((c, x) => {
    const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2, bot = (y + 1) * TILE;
    if ("SoCbFp".includes(c)) row[x] = " ";
    if (c === "S") out.start = { x: cx, y: bot };
    else if (c === "o") out.anchors.push({ x: cx, y: cy });
    else if (c === "b") out.balloons.push({ x: cx, y: cy, got: false });
    else if (c === "C") out.checkpoints.push({ x: cx, y: bot });
    else if (c === "F") out.finish = { x: cx, y: bot };
    else if (c === "p") out.pigeons.push({ x0: cx, y: cy - 10, w: 26, h: 20 });
  }));
  out.checkpoints.sort((a, b) => a.x - b.x);
  return out;
}
const tileAt = (m, tx, ty) => (ty < 0 || ty >= m.H || tx < 0 || tx >= m.W) ? (tx < 0 || tx >= m.W ? "#" : " ") : m.grid[ty][tx];
const solidAt = (m, tx, ty) => SOLID.has(tileAt(m, tx, ty));

function newState(level, tuning = T, save = null) {
  const m = parseLevel(level), D = derive(tuning);
  const s = { m, D, t: tuning, tick: 0, cp: -1, done: false, fx: [], events: [],
    p: null, dead: 0, pigeons: m.pigeons.map(p => ({ ...p, x: p.x0, dir: 1, alive: true, back: 0 })) };
  if (save) { s.cp = save.cp ?? -1; s.tick = save.tick || 0; (save.got || []).forEach(i => m.balloons[i] && (m.balloons[i].got = true)); }
  spawn(s); return s;
}
function spawnPoint(s) { return s.cp >= 0 ? s.m.checkpoints[s.cp] : s.m.start; }
function spawn(s) {
  const sp = spawnPoint(s), t = s.t;
  s.p = { x: sp.x - t.w / 2, y: sp.y - t.h, vx: 0, vy: 0, ground: true, coyote: 0, buffer: 0, jumping: false,
    wall: 0, lock: 0, lockDir: 0, rope: null, regrab: 0, face: 1, prev: { jump: false, swing: false } };
  s.pigeons.forEach(p => { p.alive = true; p.x = p.x0; p.back = 0; });
}

// Move along one axis and resolve against the tile grid. Returns contact side (-1/1) or 0.
function moveAxis(s, p, dx, dy) {
  const m = s.m, t = s.t; let hit = 0;
  if (dx) {
    p.x += dx;
    const y0 = Math.floor(p.y / TILE), y1 = Math.floor((p.y + t.h - 0.01) / TILE);
    const tx = dx > 0 ? Math.floor((p.x + t.w) / TILE) : Math.floor(p.x / TILE);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(m, tx, ty)) {
      p.x = dx > 0 ? tx * TILE - t.w : (tx + 1) * TILE; hit = Math.sign(dx); break;
    }
  }
  if (dy) {
    p.y += dy;
    const x0 = Math.floor(p.x / TILE), x1 = Math.floor((p.x + t.w - 0.01) / TILE);
    const ty = dy > 0 ? Math.floor((p.y + t.h) / TILE) : Math.floor(p.y / TILE);
    for (let tx = x0; tx <= x1; tx++) {
      const c = tileAt(m, tx, ty);
      if (SOLID.has(c) || (c === "^" && dy > 0 && p.y + t.h - dy <= ty * TILE + 0.01)) {
        p.y = dy > 0 ? ty * TILE - t.h : (ty + 1) * TILE; hit = Math.sign(dy) * (c === "^" ? 2 : 1); break;
      }
    }
  }
  return hit;
}
// Sub-step so fast launches never tunnel through a tile.
function move(s, p, dx, dy) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 8)); let hx = 0, hy = 0;
  for (let i = 0; i < n; i++) {
    if (!hx) { const h = moveAxis(s, p, dx / n, 0); if (h) hx = h; }
    if (!hy) { const h = moveAxis(s, p, 0, dy / n); if (h) hy = h; }
  }
  return { hx, hy };
}
const wallSide = (s, p) => {
  const t = s.t, y0 = Math.floor((p.y + 4) / TILE), y1 = Math.floor((p.y + t.h - 4) / TILE);
  for (const d of [-1, 1]) {
    const tx = Math.floor((d < 0 ? p.x - 1 : p.x + t.w + 1) / TILE);
    for (let ty = y0; ty <= y1; ty++) if (tileAt(s.m, tx, ty) === "W") return d;
  }
  return 0;
};
function center(s) { const p = s.p; return { x: p.x + s.t.w / 2, y: p.y + s.t.h / 2 }; }
// Nearest anchor in range that is ahead of (or above) the hero.
function findAnchor(s, skip = null) {
  const c = center(s), p = s.p; let best = null, bd = Infinity;
  for (const a of s.m.anchors) {
    const dx = a.x - c.x, dy = a.y - c.y, d = Math.hypot(dx, dy);
    if (a === skip || d > s.D.range || dy > 0) continue;
    if (dx * p.face < -TILE / 2) continue; // never grab one behind you
    if (d < bd) { bd = d; best = a; }
  }
  return best;
}
function die(s) { if (s.dead > 0 || s.done) return; s.dead = s.t.respawnTime; s.deadAt = center(s); s.poofed = false; s.events.push("fall"); s.p.rope = null; }
function burst(s, x, y, n) { for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; s.fx.push({ x, y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120 - 40, life: 0.6 }); } }

function step(s, inp) {
  const D = s.D, t = s.t, p = s.p, m = s.m;
  s.events = [];
  s.fx = s.fx.filter(f => (f.life -= DT) > 0); s.fx.forEach(f => { f.x += f.vx * DT; f.y += f.vy * DT; f.vy += 300 * DT; });
  if (s.done) return s;
  s.tick++;
  if (s.dead > 0) { s.dead -= DT; if (!s.poofed && s.dead <= s.t.poofAt) { s.poofed = true; s.events.push("poof"); burst(s, s.deadAt.x, Math.min(s.deadAt.y, s.m.H * TILE - 30), 10); } if (s.dead <= 0) { s.dead = 0; spawn(s); } return s; }
  const jumpPress = inp.jump && !p.prev.jump, swingPress = inp.swing && !p.prev.swing;
  if (swingPress || p.ground) p.last = null; // the anchor you just let go of needs a fresh press
  p.prev = { jump: !!inp.jump, swing: !!inp.swing };
  let dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  if (p.lock > 0) { p.lock -= DT; if (dir === p.lockDir) dir = 0; }
  if (dir) p.face = dir;
  p.regrab = Math.max(0, p.regrab - DT); p.inv = Math.max(0, (p.inv || 0) - DT);
  p.assist = p.ground || p.wall ? 0 : Math.max(0, (p.assist || 0) - DT);
  p.buffer = jumpPress ? t.buffer : Math.max(0, p.buffer - DT);
  p.coyote = p.ground ? t.coyote : Math.max(0, p.coyote - DT);

  // --- swing ---
  if (p.rope && !inp.swing) { // release: launch on the arc with a boost
    p.vx *= t.releaseBoost; p.vy *= t.releaseBoost; p.vy = Math.min(p.vy, -D.assistLift); clampSpeed(p, D.swingMax);
    p.last = p.rope.a; p.rope = null; p.regrab = t.regrabDelay; p.assist = t.assistTime; p.jumping = false; s.events.push("launch");
  }
  if (!p.rope && inp.swing && !p.ground && p.regrab <= 0) {
    const a = findAnchor(s, p.last);
    if (a) { const c = center(s); p.rope = { a, len: Math.min(Math.hypot(a.x - c.x, a.y - c.y), D.ropeMax) }; s.events.push("grab"); }
  }
  if (p.rope) {
    p.vy += D.g * DT; p.vx += dir * D.pump * DT;
    const c = center(s), a = p.rope.a;
    let nx = c.x + p.vx * DT, ny = c.y + p.vy * DT;
    const dx = nx - a.x, dy = ny - a.y, d = Math.hypot(dx, dy);
    if (d > p.rope.len) { nx = a.x + dx / d * p.rope.len; ny = a.y + dy / d * p.rope.len; }
    // shorten rope smoothly if it was grabbed longer than max (len already capped) -> velocity from position change
    p.vx = (nx - c.x) / DT; p.vy = (ny - c.y) / DT; clampSpeed(p, D.swingMax);
    if (p.vx) p.face = Math.sign(p.vx);
    const { hx, hy } = move(s, p, nx - c.x, ny - c.y);
    if (hx) p.vx = 0;
    if (hy) { p.vy = 0; if (hy > 0) { p.rope = null; p.ground = true; } }
  } else {
    // --- horizontal ---
    const target = dir * D.top;
    if (dir && Math.abs(p.vx) > D.top && Math.sign(p.vx) === dir) p.vx = Math.sign(p.vx) * Math.max(D.top, Math.abs(p.vx) - D.overDrag * DT);
    else if (dir) p.vx = approach(p.vx, target, (Math.sign(p.vx) === dir || !p.vx ? D.accel : D.decel) * DT);
    else p.vx = approach(p.vx, 0, (p.ground ? D.decel : D.airDecel) * DT);
    // --- jumps ---
    if (p.buffer > 0 && p.coyote > 0) { p.vy = -D.jumpV; p.jumping = true; p.buffer = 0; p.coyote = 0; p.ground = false; s.events.push("jump"); }
    else if (p.buffer > 0 && p.wall && !p.ground) {
      p.vy = -D.wallUp; p.vx = -p.wall * D.wallOut; p.lock = t.wallLock; p.lockDir = p.wall; p.face = -p.wall;
      p.jumping = false; p.buffer = 0; s.events.push("walljump");
    }
    if (p.assist > 0 && dir !== -p.face) { // steer horizontally toward the landing roof; gravity untouched
      const need = landingSpeed(s); const want = Math.max(D.assistMin, need ?? 0);
      if (p.face * p.vx < want) p.vx = p.face * Math.min(want, D.swingMax);
    }
    // --- gravity ---
    let g = D.g;
    if (p.vy > 0) g *= t.fallMult; else if (p.jumping && !inp.jump) g *= D.cutMult;
    p.vy = Math.min(p.vy + g * DT, D.maxFall);
    if (p.wall && p.vy > D.wallSlide && dir !== -p.wall) p.vy = D.wallSlide;
    const wasGround = p.ground;

  requestAnimationFrame(frame);
  if (running) {
    acc += Math.min(0.25, (now - last) / 1000); last = now;
    let n = 0;
    while (acc >= DT && n < 8) { step(s, input.poll()); acc -= DT; n++;
      if (s.events.includes("checkpoint")) saveCp();
      if (s.events.includes("finish")) { finish(); break; } }
    if (n === 8) acc = 0;
  } else last = now;
  $("#time").textContent = fmt(s.tick); $("#bal").textContent = `🎈 ${balloonsGot(s)}/${total}`;
  R.draw(s, 1, (now - t0) / 1000);
}
showTitle(); requestAnimationFrame(frame);

</script></body></html>
